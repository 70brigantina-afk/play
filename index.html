<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Охотник</title>
<style>body{font:15px Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:1200px;margin:auto;padding:24px}header{background:#111827;color:#fff;padding:25px;border-radius:18px}h1{margin:0;font-size:36px}.f{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,button,a{padding:10px;border-radius:9px;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.c{background:#fff;padding:16px;border-radius:14px}.p{color:#d11;font-weight:bold}.b{font-weight:bold}.m{color:#667;font-size:12px}.contact{background:#eef2ff;padding:8px;border-radius:8px;margin:8px 0}a,button{background:#111827;color:white;text-decoration:none;cursor:pointer}.copy{background:#eee;color:#111}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.box b{display:block;margin-bottom:6px}.full{grid-column:1/-1}.notes{width:100%;box-sizing:border-box;min-height:55px;padding:9px;border:1px solid #ddd;border-radius:8px}.links{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.wa{background:#167c4b}.tg{background:#1677a8}@media(max-width:850px){.grid,.tools{grid-template-columns:1fr}}</style>
<main><header><h1>Охотник</h1><div>ПРОВЕРЕННЫЕ контакты • сайты • лендинги • Tilda • Яндекс Директ</div></header><div class=f><input id=q placeholder="Поиск"><select id=s><option>Все статусы</option><option>не писала</option><option>написала</option><option>ответил</option><option>созвон</option><option>заказ</option><option>в работе</option><option>сделано</option></select></div><div id=g class=grid></div></main>
<script>
const raw=[["Лендинг — 1 экран + адаптив","Дизайнер на лендинг: один экран и адаптив. Портфолио просят сразу.","15 000 ₽","@nailya_khismatova_w","https://t.me/nailya_khismatova_w"],["Доработка сайта маркетинг-агентства","Нужно доупаковать сайт маркетингового агентства; ищут веб-дизайнера с опытом.","договорная","@ushakovbz","https://t.me/ushakovbz"],["Сайт спортивного центра","Дизайн многостраничного сайта по прототипу и референсу; отдельно можно обсудить верстку.","договорная","@V_Vaysbrod","https://t.me/V_Vaysbrod"],["Директолог в B2B-агентство","Яндекс Директ для B2B-производств, связка лендинг + Директ; проектная загрузка.","90 000–100 000 ₽ совокупно","@djon_galt","https://t.me/djon_galt"],["Яндекс Директ — проекты агентства","Настройка и ведение Яндекс Директ; оплата за один проект, возможно несколько проектов.","от 15 000 ₽/проект","@omrmakcim","https://t.me/omrmakcim"],["Tilda — разовые работы и сотрудничество","Гайды и лендинги на Tilda, сначала разовые задачи с перспективой постоянного сотрудничества.","договорная","@andsc1978","https://t.me/andsc1978"]];
function message(x){return 'Здравствуйте! Меня зовут Ирина. Увидела ваш запрос «'+x[0]+'». Мне понравилось, что задача сформулирована конкретно: '+x[1]+'. Я занимаюсь созданием сайтов, лендингов, квизов и Яндекс Директ. Могу начать оперативно и предложить решение именно под вашу задачу. Портфолио: https://irina.iamcore.ru/ Если запрос ещё актуален — напишите, пожалуйста.'}
function gate(x){return 'Здравствуйте! Меня зовут Ирина, я занимаюсь сайтами и интернет-рекламой. Нашла ваш запрос «'+x[0]+'». Подскажите, пожалуйста, с кем можно поговорить по вопросу сайта/рекламы? Как зовут человека, который принимает решение?'}
function lpr(x){return 'Здравствуйте! Меня зовут Ирина. Я посмотрела ваш запрос «'+x[0]+'». Вижу, что вам нужно: '+x[1]+'. Я могу взять эту задачу на себя. Предлагаю сначала коротко уточнить цель и текущую ситуацию, после чего я назову конкретный план, срок и стоимость. Удобно сейчас 3–5 минут поговорить?'}
function contactLinks(x){let v=x[3];let out='';if(v.startsWith('@')){let u=v.slice(1);out+='<a class="tg" target="_blank" href="https://t.me/'+u+'">Telegram</a>'}let p=v.replace(/[^0-9+]/g,'');if(/^\+?\d{10,}$/.test(p)){let n=p.replace(/\D/g,'');out+='<a target="_blank" href="tel:'+p+'">Позвонить</a><a class="wa" target="_blank" href="https://wa.me/'+n+'">WhatsApp</a>'}if(v.includes('@')&&!v.startsWith('@'))out+='<a target="_blank" href="mailto:'+v+'">Email</a>';return out}
function render(){
 const grid=document.getElementById('g'); grid.innerHTML='';
 const query=document.getElementById('q').value.toLowerCase();
 const wanted=document.getElementById('s').value;
 raw.forEach((x,i)=>{
  const st=localStorage.getItem('h'+i)||'не писала';
  if(query&&!x.join(' ').toLowerCase().includes(query))return;
  if(wanted!=='Все статусы'&&wanted!==st)return;
  const card=document.createElement('div'); card.className='c';
  const top=document.createElement('div'); top.className='m'; top.textContent='№'+(i+1)+' • заказ из базы';
  const pr=document.createElement('div'); pr.className='p'; pr.textContent='🔥 ПРИОРИТЕТ';
  const h=document.createElement('h3'); h.textContent=x[0];
  const task=document.createElement('p'); task.textContent=x[1];
  const money=document.createElement('div'); money.className='b'; money.textContent='💰 '+x[2];
  const contact=document.createElement('div'); contact.className='contact'; contact.innerHTML='<b>Контакт:</b> '; contact.append(document.createTextNode(x[3]));
  const links=document.createElement('div'); links.className='links'; links.innerHTML=contactLinks(x)+'<a target="_blank" href="'+x[4]+'">Источник заказа</a>';
  const tools=document.createElement('div'); tools.className='tools';
  function box(title,txt,full){const d=document.createElement('div');d.className='box'+(full?' full':'');const b=document.createElement('b');b.textContent=title;d.append(b,document.createTextNode(txt));return d}
  tools.append(
   box('Отзывы и репутация','Показывать здесь только подтверждённые отзывы. Для этой записи они пока не добавлены.'),
   box('Контакты и каналы связи',x[3]),
   box('Что понравилось / за что похвалить',x[1]+'.'),
   box('Отзыв-крючок','Начать с конкретной сильной стороны клиента или его задачи.'),
   box('Что предложить именно им',x[1]+'. Уточнить цель, сроки, материалы и источник клиентов.'),
   box('Сообщение клиенту',message(x),true),
   box('Если трубку взял не ЛПР',gate(x)),
   box('Разговор с ЛПР',lpr(x))
  );
  const msg=tools.children[5], gateBox=tools.children[6], lprBox=tools.children[7];
  [[msg,'Копировать сообщение',message(x)],[gateBox,'Копировать',gate(x)],[lprBox,'Копировать',lpr(x)]].forEach(z=>{const br=document.createElement('br'),bt=document.createElement('button');bt.className='copy';bt.textContent=z[1];bt.onclick=()=>navigator.clipboard.writeText(z[2]);z[0].append(br,bt)});
  const notes=box('Мои комментарии','',true), ta=document.createElement('textarea'); ta.className='notes';ta.placeholder='Что ответили, имя ЛПР, когда перезвонить, договорённости...';ta.value=localStorage.getItem('note'+i)||'';ta.oninput=()=>localStorage.setItem('note'+i,ta.value);notes.append(ta);tools.append(notes);
  const sel=document.createElement('select'); ['не писала','написала','ответил','созвон','заказ','в работе','сделано'].forEach(v=>{const o=document.createElement('option');o.textContent=v;o.value=v;if(v===st)o.selected=true;sel.append(o)});sel.onchange=()=>{localStorage.setItem('h'+i,sel.value);render()};
  card.append(top,pr,h,task,money,contact,links,tools,sel); grid.append(card);
 });
}
q.oninput=render;s.onchange=render;render();
</script>
