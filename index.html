09.2026; ссылка ведёт на карточку","26.09.2026"],["2D AI Artist — рекламные баннеры","Международный игровой проект: создавать рекламные визуалы через ChatGPT, Stable Diffusion, ComfyUI и дорабатывать их в Photoshop. Требуются портфолио, опыт 2D и практическая работа с AI.","200 000–249 000 ₽/мес, оценка","Отклик через страницу вакансии","https://jabka.work/jobs/ishchut-2d-ai-pixeltalent-20260925-6vr6","https://jabka.work/jobs/ishchut-2d-ai-pixeltalent-20260925-6vr6","вакансия опубликована 26.09.2026; в условиях указана релокация на Кипр","26.09.2026"],["Руководитель AI-контент-производства — beauty","Нужно выстроить полный цикл производства Reels, Shorts, статей и спецпроектов, активно применять нейросети, аналитику, работать с блогерами и подрядчиками. Полная удалёнка.","от 200 000 ₽/мес","Отклик через страницу вакансии","https://jabka.work/jobs/rukovoditel-kontent-zavoda-sozdanie-virusnogo-kontenta-ap-marketing-20260925-3k4d","https://jabka.work/jobs/rukovoditel-kontent-zavoda-sozdanie-virusnogo-kontenta-ap-marketing-20260925-3k4d","вакансия опубликована 26.09.2026; ссылка ведёт на карточку","26.09.2026"],["Корпоративный сайт игровой студии — Alwa Studios","Основатель игровой студии ищет веб-дизайнера для разработки дизайна корпоративного сайта. Это именно веб-заказ, а не абстрактная база вакансий.","по договорённости","Отклик на Designer.ru","https://designer.ru/u/alwa-studios-ishchet-veb-dizaynera/","https://telemetr.me/content/designer_ru_work","объявление датировано 25.09.2026 18:18; ссылка на страницу отклика Designer.ru","25.09.2026"],["Веб-дизайнер — World Vision","Создание визуалов для сайта и рекламы, дизайн интернет-страниц и лендингов, презентации и инфографика. Figma, Photoshop, Illustrator; Tilda и базовый HTML — плюс. Возможна удалёнка.","от 100 000 ₽/мес","Отклик через страницу вакансии","https://hirehi.ru/design/veb-dizainer-kliniki-96634","https://hirehi.ru/design/veb-dizainer-kliniki-96634","вакансия размещена 24.09 и попала в свежие выдачи 25.09; ссылка на карточку вакансии","24–25.09.2026"]];
function message(x){
 const t=(x[0]+' '+x[1]).toLowerCase();
 let prof='Я работаю с нейросетями и AI-инструментами, создаю сайты и digital-материалы.';
 if(t.includes('директ')) prof='Я занимаюсь Яндекс Директ, аналитикой рекламных кампаний и связкой рекламы с посадочными страницами.';
 else if(t.includes('сайт')||t.includes('ui/ux')||t.includes('веб')) prof='Я создаю сайты и лендинги, работаю с веб-дизайном и AI-инструментами.';
 else if(t.includes('ai')||t.includes('ии')||t.includes('нейрос')) prof='Я специалист по нейросетям и AI-контенту, работаю с генерацией визуалов и digital-задачами.';
 return 'Здравствуйте! Меня зовут Ирина. Увидела вашу вакансию/задачу «'+x[0]+'». '+prof+' Мне особенно откликнулась задача: '+x[1]+' Портфолио: https://irina.iamcore.ru/ Если позиция ещё актуальна, буду рада обсудить, чем могу быть полезна.';
}
function gate(x){return 'Здравствуйте! Меня зовут Ирина, я занимаюсь сайтами и интернет-рекламой. Нашла ваш запрос «'+x[0]+'». Подскажите, пожалуйста, с кем можно поговорить по вопросу сайта/рекламы? Как зовут человека, который принимает решение?'}
function lpr(x){return 'Здравствуйте! Меня зовут Ирина. Я посмотрела ваш запрос «'+x[0]+'». Вижу, что вам нужно: '+x[1]+'. Я могу взять эту задачу на себя. Предлагаю сначала коротко уточнить цель и текущую ситуацию, после чего я назову конкретный план, срок и стоимость. Удобно сейчас 3–5 минут поговорить?'}
function contactLinks(x){
 let out='';
 const u=x[4]||'';
 if(/^https:\/\/t\.me\/[A-Za-z0-9_]+\/?$/.test(u)) out+='<a class="tg" target="_blank" rel="noopener" href="'+u+'">Написать в Telegram</a>';
 else if(/^mailto:/.test(u)) out+='<a target="_blank" href="'+u+'">Email</a>';
 else if(/^https?:\/\//.test(u)) out+='<a target="_blank" rel="noopener" href="'+u+'">Откликнуться</a>';
 return out
}
function render(){
 const grid=document.getElementById('g'); grid.innerHTML='';
 const query=document.getElementById('q').value.toLowerCase();
 const wanted=document.getElementById('s').value;
 raw.forEach((x,i)=>{
  const key=(x[3]||x[0]).replace(/[^a-zA-Z0-9а-яА-Я_+]/g,'_'); const st=localStorage.getItem('h_'+key)||'не писала';
  if(query&&!x.join(' ').toLowerCase().includes(query))return;
  if(wanted!=='Все статусы'&&wanted!==st)return;
  const card=document.createElement('div'); card.className='c';
  const top=document.createElement('div'); top.className='m'; top.textContent='№'+(i+1)+' • '+(x[7]||'свежая выдача')+' • проверенная ссылка';
  const pr=document.createElement('div'); pr.className='p'; pr.textContent='🔥 ПРИОРИТЕТ';
  const h=document.createElement('h3'); h.textContent=x[0];
  const task=document.createElement('p'); task.textContent=x[1];
  const money=document.createElement('div'); money.className='b'; money.textContent='💰 '+x[2];
  const contact=document.createElement('div'); contact.className='contact'; contact.innerHTML='<b>Контакт:</b> '; contact.append(document.createTextNode(x[3]));
  const ok=document.createElement('div'); ok.className='ok'; ok.textContent='✅ '+(x[6]||'Контакт проверен'); const links=document.createElement('div'); links.className='links'; links.innerHTML=contactLinks(x)+(x[5]?'<a target="_blank" rel="noopener" href="'+x[5]+'">Источник объявления</a>':'');
  const tools=document.createElement('div'); tools.className='tools';
  function box(title,txt,full){const d=document.createElement('div');d.className='box'+(full?' full':'');const b=document.createElement('b');b.textContent=title;d.append(b,document.createTextNode(txt));return d}
  tools.append(
   box('Отзывы и репутация','Показывать здесь только подтверждённые отзывы. Для этой записи они пока не добавлены.'),
   box('Контакты и каналы связи',x[3]),
   box('Что понравилось / за что похвалить',x[1]+'.'),
   box('Отзыв-крючок','Начать с конкретной сильной стороны клиента или его задачи.'),
   box('Что предложить именно им',x[1]+'. Уточнить цель, сроки, материалы и источник клиентов.'),
   box('Сообщение клиенту',message(x),true),
   box('Если трубку взял не ЛПР',gate(x)),
   box('Разговор с ЛПР',lpr(x))
  );
  const msg=tools.children[5], gateBox=tools.children[6], lprBox=tools.children[7];
  [[msg,'Копировать сообщение',message(x)],[gateBox,'Копировать',gate(x)],[lprBox,'Копировать',lpr(x)]].forEach(z=>{const br=document.createElement('br'),bt=document.createElement('button');bt.className='copy';bt.textContent=z[1];bt.onclick=()=>navigator.clipboard.writeText(z[2]);z[0].append(br,bt)});
  const notes=box('Мои комментарии','',true), ta=document.createElement('textarea'); ta.className='notes';ta.placeholder='Что ответили, имя ЛПР, когда перезвонить, договорённости...';ta.value=localStorage.getItem('note_'+key)||'';ta.oninput=()=>localStorage.setItem('note_'+key,ta.value);notes.append(ta);tools.append(notes);
  const sel=document.createElement('select'); ['не писала','написала','ответил','созвон','заказ','в работе','сделано'].forEach(v=>{const o=document.createElement('option');o.textContent=v;o.value=v;if(v===st)o.selected=true;sel.append(o)});sel.onchange=()=>{localStorage.setItem('h_'+key,sel.value);render()};
  card.append(top,pr,h,task,money,contact,ok,links,tools,sel); grid.append(card);
 });
}
q.oninput=render;s.onchange=render;render();
</script>
