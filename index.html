<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Охотник</title>
<style>body{font:15px Arial;background:#f4f6f8;margin:0;color:#17202a}main{max-width:1200px;margin:auto;padding:24px}header{background:#111827;color:#fff;padding:25px;border-radius:18px}h1{margin:0;font-size:36px}.f{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,button,a{padding:10px;border-radius:9px;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.c{background:#fff;padding:16px;border-radius:14px}.p{color:#d11;font-weight:bold}.b{font-weight:bold}.m{color:#667;font-size:12px}.contact{background:#eef2ff;padding:8px;border-radius:8px;margin:8px 0}.ok{display:inline-block;background:#ecfdf5;color:#166534;font-weight:bold;padding:7px 9px;border-radius:8px;margin:4px 0 8px}a,button{background:#111827;color:white;text-decoration:none;cursor:pointer}.copy{background:#eee;color:#111}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.box b{display:block;margin-bottom:6px}.full{grid-column:1/-1}.notes{width:100%;box-sizing:border-box;min-height:55px;padding:9px;border:1px solid #ddd;border-radius:8px}.links{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.wa{background:#167c4b}.tg{background:#1677a8}@media(max-width:850px){.grid,.tools{grid-template-columns:1fr}}</style>
<main><header><h1>Охотник</h1><div>ПРОВЕРЕННЫЕ контакты • сайты • лендинги • Tilda • Яндекс Директ</div></header><div class=f><input id=q placeholder="Поиск"><select id=s><option>Все статусы</option><option>не писала</option><option>написала</option><option>ответил</option><option>созвон</option><option>заказ</option><option>в работе</option><option>сделано</option></select></div><div id=g class=grid></div></main>
<script>
const raw=[["AI-first Web Designer — MOX Creative Studio","Лендинги и digital-дизайн с AI-first подходом. Нужны веб-дизайн, портфолио и уверенная работа с Recraft, Midjourney, ChatGPT, Claude, Codex, Flux, Krea, Ideogram. Удалённо, full-time / part-time / проектно.","по договорённости","@mox_web_designer_bot","https://t.me/mox_web_designer_bot","https://t.me/s/zakaz_design?before=4751","Telegram проверен 26.09.2026"],["34 рекламных креатива + анимация","Нужно сделать серию из 34 вертикальных креативов по готовым ТЗ, выдержать единый стиль и анимировать материалы. При отклике нужны портфолио, стоимость и срок старта.","по договорённости","@iokugggg","https://t.me/iokugggg","https://t.me/s/zakaz_design?before=4759","Telegram проверен 26.09.2026"],["Дизайнер креативов — постоянное сотрудничество","Ищут опытного дизайнера для регулярного создания рекламных креативов. Удалённая работа; при отклике сразу нужны портфолио и стоимость одного креатива.","по договорённости","@Ami6780","https://t.me/Ami6780","https://t.me/s/zakaz_design?before=4762","Telegram проверен 26.09.2026"],["Дизайнер для Яндекс Карт / 2ГИС / Google Maps — Outline Agency","Удалённая работа с коммерческим дизайном: обложки, баннеры, информационные слайды и рекламные креативы для карточек бизнеса. Нейросети и понимание маркетинга — плюс.","по договорённости","@ivan_outline","https://t.me/ivan_outline","https://t.me/s/zakaz_design","Telegram проверен 26.09.2026"],["Дизайнер для соцсетей и рекламных материалов","Удалённая проектная работа на долгосрочной основе: оформление сообществ, баннеры, обложки, посты, сторис и рекламные материалы. Нужны портфолио и короткая информация об опыте.","по договорённости","@dadykinara","https://t.me/dadykinara","https://t.me/s/zakaz_design","Telegram проверен 26.09.2026"],["AI-дизайнер — реалистичная работа с фото","Разовая задача для специалиста по нейросетям: реалистично добавить медийного человека на селфи. Подходит как быстрый заказ на AI-визуал.","по договорённости","@gosdepartament","https://t.me/gosdepartament","https://t.me/s/zakaz_design?before=4748","Telegram проверен 26.09.2026"]];
function message(x){return 'Здравствуйте! Меня зовут Ирина. Увидела ваш запрос «'+x[0]+'». Мне понравилось, что задача сформулирована конкретно: '+x[1]+'. Я занимаюсь созданием сайтов, лендингов, квизов и Яндекс Директ. Могу начать оперативно и предложить решение именно под вашу задачу. Портфолио: https://irina.iamcore.ru/ Если запрос ещё актуален — напишите, пожалуйста.'}
function gate(x){return 'Здравствуйте! Меня зовут Ирина, я занимаюсь сайтами и интернет-рекламой. Нашла ваш запрос «'+x[0]+'». Подскажите, пожалуйста, с кем можно поговорить по вопросу сайта/рекламы? Как зовут человека, который принимает решение?'}
function lpr(x){return 'Здравствуйте! Меня зовут Ирина. Я посмотрела ваш запрос «'+x[0]+'». Вижу, что вам нужно: '+x[1]+'. Я могу взять эту задачу на себя. Предлагаю сначала коротко уточнить цель и текущую ситуацию, после чего я назову конкретный план, срок и стоимость. Удобно сейчас 3–5 минут поговорить?'}
function contactLinks(x){
 let out='';
 const u=x[4]||'';
 if(/^https:\/\/t\.me\/[A-Za-z0-9_]+\/?$/.test(u)) out+='<a class="tg" target="_blank" rel="noopener" href="'+u+'">Написать в Telegram</a>';
 else if(/^mailto:/.test(u)) out+='<a target="_blank" href="'+u+'">Email</a>';
 else if(/^https?:\/\//.test(u)) out+='<a target="_blank" rel="noopener" href="'+u+'">Откликнуться</a>';
 return out
}
function render(){
 const grid=document.getElementById('g'); grid.innerHTML='';
 const query=document.getElementById('q').value.toLowerCase();
 const wanted=document.getElementById('s').value;
 raw.forEach((x,i)=>{
  const key=(x[3]||x[0]).replace(/[^a-zA-Z0-9а-яА-Я_+]/g,'_'); const st=localStorage.getItem('h_'+key)||'не писала';
  if(query&&!x.join(' ').toLowerCase().includes(query))return;
  if(wanted!=='Все статусы'&&wanted!==st)return;
  const card=document.createElement('div'); card.className='c';
  const top=document.createElement('div'); top.className='m'; top.textContent='№'+(i+1)+' • проверенная карточка';
  const pr=document.createElement('div'); pr.className='p'; pr.textContent='🔥 ПРИОРИТЕТ';
  const h=document.createElement('h3'); h.textContent=x[0];
  const task=document.createElement('p'); task.textContent=x[1];
  const money=document.createElement('div'); money.className='b'; money.textContent='💰 '+x[2];
  const contact=document.createElement('div'); contact.className='contact'; contact.innerHTML='<b>Контакт:</b> '; contact.append(document.createTextNode(x[3]));
  const ok=document.createElement('div'); ok.className='ok'; ok.textContent='✅ '+(x[6]||'Контакт проверен'); const links=document.createElement('div'); links.className='links'; links.innerHTML=contactLinks(x)+(x[5]?'<a target="_blank" rel="noopener" href="'+x[5]+'">Источник объявления</a>':'');
  const tools=document.createElement('div'); tools.className='tools';
  function box(title,txt,full){const d=document.createElement('div');d.className='box'+(full?' full':'');const b=document.createElement('b');b.textContent=title;d.append(b,document.createTextNode(txt));return d}
  tools.append(
   box('Отзывы и репутация','Показывать здесь только подтверждённые отзывы. Для этой записи они пока не добавлены.'),
   box('Контакты и каналы связи',x[3]),
   box('Что понравилось / за что похвалить',x[1]+'.'),
   box('Отзыв-крючок','Начать с конкретной сильной стороны клиента или его задачи.'),
   box('Что предложить именно им',x[1]+'. Уточнить цель, сроки, материалы и источник клиентов.'),
   box('Сообщение клиенту',message(x),true),
   box('Если трубку взял не ЛПР',gate(x)),
   box('Разговор с ЛПР',lpr(x))
  );
  const msg=tools.children[5], gateBox=tools.children[6], lprBox=tools.children[7];
  [[msg,'Копировать сообщение',message(x)],[gateBox,'Копировать',gate(x)],[lprBox,'Копировать',lpr(x)]].forEach(z=>{const br=document.createElement('br'),bt=document.createElement('button');bt.className='copy';bt.textContent=z[1];bt.onclick=()=>navigator.clipboard.writeText(z[2]);z[0].append(br,bt)});
  const notes=box('Мои комментарии','',true), ta=document.createElement('textarea'); ta.className='notes';ta.placeholder='Что ответили, имя ЛПР, когда перезвонить, договорённости...';ta.value=localStorage.getItem('note_'+key)||'';ta.oninput=()=>localStorage.setItem('note_'+key,ta.value);notes.append(ta);tools.append(notes);
  const sel=document.createElement('select'); ['не писала','написала','ответил','созвон','заказ','в работе','сделано'].forEach(v=>{const o=document.createElement('option');o.textContent=v;o.value=v;if(v===st)o.selected=true;sel.append(o)});sel.onchange=()=>{localStorage.setItem('h_'+key,sel.value);render()};
  card.append(top,pr,h,task,money,contact,ok,links,tools,sel); grid.append(card);
 });
}
q.oninput=render;s.onchange=render;render();
</script>
